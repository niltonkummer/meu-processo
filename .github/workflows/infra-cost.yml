# Required repository secret for trusted Terraform pull requests:
#   INFRACOST_API_KEY
#
# Cost assessments remain mandatory and fork-safe for every pull request. The
# Infracost step never receives Google Cloud credentials and never applies IaC.
name: Infra cost

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  cost-assessment:
    name: Cost assessment
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      terraform-changed: ${{ steps.assessment.outputs.terraform_changed }}
      terraform-baseline: ${{ steps.assessment.outputs.terraform_baseline }}
    steps:
      - name: Checkout pull request history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Require an approved cost assessment
        id: assessment
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          if [[ ! "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]] || [[ ! "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Invalid pull request commit identifiers."
            exit 1
          fi

          changed_files="$RUNNER_TEMP/changed-files.txt"
          git diff --name-only --diff-filter=ACMRD "$BASE_SHA" "$HEAD_SHA" > "$changed_files"

          pointer_file=".github/deploy-cost-assessment"
          if [[ ! -f "$pointer_file" ]]; then
            echo "::error::Every pull request must select an approved cost assessment."
            exit 1
          fi
          cost_file=$(tr -d '\r\n' < "$pointer_file")
          if [[ ! "$cost_file" =~ ^docs/costs/[0-9]{4}-[a-z0-9][a-z0-9-]*\.md$ ]] \
            || ! grep -Fqx "$cost_file" "$changed_files"; then
            echo "::error::The selected cost assessment must be added or updated by this pull request."
            exit 1
          fi
          if [[ ! -f "$cost_file" ]] \
            || ! grep -Fqx '<!-- infra-cost-assessment:v1 -->' "$cost_file" \
            || ! grep -Eq '^\*\*Status:\*\* aprovado para implementação( e rollout de validação)?[[:space:]]*$' "$cost_file" \
            || ! grep -Eq '^\*\*Custo mensal atual \(USD\):\*\* .+' "$cost_file" \
            || ! grep -Eq '^\*\*Custo mensal esperado \(USD\):\*\* .+' "$cost_file" \
            || ! grep -Eq '^\*\*Custo mensal limite \(USD\):\*\* .+' "$cost_file" \
            || ! grep -Eq '^\*\*Aprovação:\*\* .+' "$cost_file"; then
            echo "::error file=$cost_file::Assessment is incomplete or is not approved for implementation."
            exit 1
          fi
          echo "Cost assessment accepted: $cost_file"

          terraform_changed=false
          if grep -Eq '^infra/terraform/' "$changed_files"; then
            terraform_changed=true
          fi
          terraform_baseline=false
          if git cat-file -e "$BASE_SHA:infra/terraform/main.tf" 2>/dev/null; then
            terraform_baseline=true
          fi
          echo "terraform_changed=$terraform_changed" >> "$GITHUB_OUTPUT"
          echo "terraform_baseline=$terraform_baseline" >> "$GITHUB_OUTPUT"

          {
            echo "## Infrastructure cost gate"
            echo
            echo "- Approved assessment: yes"
            echo "- Terraform changed: $terraform_changed"
            echo "- Terraform baseline exists: $terraform_baseline"
            echo "- Approved assessment: $cost_file"
          } >> "$GITHUB_STEP_SUMMARY"

  terraform-cost-diff:
    name: Terraform cost diff
    needs: cost-assessment
    if: needs.cost-assessment.outputs.terraform-changed == 'true' && needs.cost-assessment.outputs.terraform-baseline == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Require a trusted pull request
        env:
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          TARGET_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [[ "$HEAD_REPOSITORY" != "$TARGET_REPOSITORY" ]]; then
            echo "::error::Terraform cost estimation must be rerun from a trusted branch because fork pull requests do not receive secrets."
            exit 1
          fi

      - name: Require the Infracost token
        env:
          INFRACOST_API_KEY: ${{ secrets.INFRACOST_API_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "$INFRACOST_API_KEY" ]]; then
            echo "::error::Configure the INFRACOST_API_KEY repository secret before merging Terraform changes."
            exit 1
          fi

      - name: Checkout proposed infrastructure
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: head
          fetch-depth: 1

      - name: Checkout baseline infrastructure
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
          fetch-depth: 1

      # The v4 scanner requires a token generated by `infracost ci setup` and
      # rejects regular organization CLI tokens. Keep this deterministic CLI
      # path until the repository is connected to the Infracost GitHub App.
      - name: Install the pinned Infracost CLI
        uses: infracost/actions/setup@e9d6e6cd65e168e76b0de50ff9957d2fe8bb1832 # v3.0.1
        with:
          api-key: ${{ secrets.INFRACOST_API_KEY }}
          version: "0.10.45"

      - name: Calculate the baseline cost
        run: |
          set -euo pipefail
          infracost breakdown \
            --path=base/infra/terraform \
            --format=json \
            --out-file="$RUNNER_TEMP/infracost-base.json"

      - name: Calculate the proposed cost difference
        run: |
          set -euo pipefail
          infracost diff \
            --path=head/infra/terraform \
            --format=json \
            --compare-to="$RUNNER_TEMP/infracost-base.json" \
            --out-file="$RUNNER_TEMP/infracost-diff.json"

      - name: Publish the Terraform cost difference
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          infracost comment github \
            --path="$RUNNER_TEMP/infracost-diff.json" \
            --repo="$GITHUB_REPOSITORY" \
            --github-token="$GITHUB_TOKEN" \
            --pull-request="$PULL_REQUEST_NUMBER" \
            --behavior=update

  terraform-cost-bootstrap:
    name: Terraform bootstrap cost evidence
    needs: cost-assessment
    if: needs.cost-assessment.outputs.terraform-changed == 'true' && needs.cost-assessment.outputs.terraform-baseline == 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout proposed baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Require recorded local Infracost evidence
        run: |
          set -euo pipefail
          cost_file=$(tr -d '\r\n' < .github/deploy-cost-assessment)
          grep -Fq '## 9. Evidência pós-implementação local' "$cost_file"
          grep -Fq '20 recursos Terraform' "$cost_file"
          grep -Fq 'US$ 0,02' "$cost_file"
          echo "Initial Terraform baseline accepted with reviewed local scan evidence. Remote cost diffs are mandatory after this merge."
